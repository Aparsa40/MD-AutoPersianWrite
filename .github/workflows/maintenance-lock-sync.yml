name: Synchronize release lockfile

on:
  push:
    branches:
      - chore/release-hardening-v2.2.0

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/release-hardening-v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit synchronized lockfile and clean up workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/maintenance-lock-sync.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore(lockfile): sync TypeScript release dependency"
          git push
