name: Repair npm lockfile

on:
  push:
    branches:
      - feat/workspace-reliability-ux-2.6.0

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Regenerate lockfile from a clean dependency graph
        run: |
          rm -rf node_modules package-lock.json
          npm install --package-lock-only --ignore-scripts
      - name: Commit repaired lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: regenerate npm lockfile with platform bindings [skip ci]"
          git push origin HEAD:feat/workspace-reliability-ux-2.6.0
