name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Install dependencies
      run: npm install --include=optional --package-lock=false
    - name: Ensure Linux Rolldown native binding
      run: npm install --no-save --include=optional --package-lock=false @rolldown/binding-linux-x64-gnu@1.2.3
    - run: npm run lint
    - run: npm run typecheck
    - run: npm run test
    - run: npm run build
