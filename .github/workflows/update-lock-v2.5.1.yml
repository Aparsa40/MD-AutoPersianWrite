name: Update v2.5.1 lockfile

on:
  push:
    branches:
      - fix/mermaid-rendering-refresh-v2.5.1

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - name: Regenerate package-lock.json
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/update-lock-v2.5.1.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git rm .github/workflows/update-lock-v2.5.1.yml
          git add package-lock.json
          git commit -m "chore: sync package lock for v2.5.1"
          git push origin HEAD:${GITHUB_REF_NAME}
